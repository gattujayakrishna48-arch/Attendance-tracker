{% extends "base.html" %}
{% block title %}Login – Attendance Tracker{% endblock %}

{% block content %}
<div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem;">📋</span>
        <h2 style="margin-top: .5rem; color: var(--clr-primary);">Welcome Back</h2>
        <p class="text-muted" style="font-size: .9rem;">Sign in to your Attendance Tracker account</p>
    </div>

    <!-- Quick Demo Login Banner -->
    <div style="background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: .85rem 1rem; margin-bottom: 1.5rem; text-align: center;">
        <div style="font-size: .85rem; color: #4338ca; font-weight: 600; margin-bottom: .4rem;">
            🎯 Demo Account: <code>student</code> / <code>password123</code>
        </div>
        <form method="POST" action="{{ url_for('demo_login') }}" style="margin: 0;">
            <button type="submit" class="btn btn-sm btn-primary" style="width: 100%; font-size: .85rem; padding: .4rem;">
                ⚡ 1-Click Demo Login
            </button>
        </form>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="e.g. student or your username" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Enter your password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: .75rem; font-size: 1rem;">
            Sign In
        </button>
    </form>

    <div style="margin-top: 1.25rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
        <p class="auth-footer" style="margin: 0;">
            New student? <a href="{{ url_for('signup') }}" style="font-weight: 600;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
