{% extends "base.html" %}
{% block title %}Reset Password – Attendance Tracker{% endblock %}

{% block content %}
<div class="auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span style="font-size: 2.5rem;">🔑</span>
        <h2 style="margin-top: .5rem; color: var(--clr-primary);">Reset Password</h2>
        <p class="text-muted" style="font-size: .9rem;">Enter your username to set a new password</p>
    </div>

    <form method="POST" action="{{ url_for('reset_password') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="Enter your registered username" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required minlength="6"
                   placeholder="At least 6 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                   placeholder="Re-enter new password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="padding: .75rem; font-size: 1rem;">
            Update Password
        </button>
    </form>

    <div style="margin-top: 1.25rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
        <p class="auth-footer" style="margin: 0;">
            Remember your password? <a href="{{ url_for('login') }}" style="font-weight: 600;">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
